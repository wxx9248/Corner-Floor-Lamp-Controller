[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duoco-stripx"
version = "0.0.0"
description = "BLE control library for duoCo StripX (MELK-) LED strip/floor-lamp controllers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wxx9248" }]
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.4.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/wxx9248/Corner-Floor-Lamp-Controller"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/duoco_stripx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
